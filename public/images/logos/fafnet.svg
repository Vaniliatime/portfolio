<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FafNet">
  <defs>
    <linearGradient id="fn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#fn-bg)"/>

  <!-- Signal spreading from the source: the internet provider half. -->
  <g stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" fill="none">
    <path d="M20 30a17 17 0 0 1 24 0" opacity="0.55"/>
    <path d="M25.5 36.5a9 9 0 0 1 13 0" opacity="0.8"/>
  </g>

  <circle cx="32" cy="43" r="3.6" fill="#ffffff"/>

  <!-- Two subscribers cabled back to it: the local network half. -->
  <g stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.75">
    <path d="M32 46.6v4.4M32 51h-11M32 51h11M21 51v2.5M43 51v2.5"/>
  </g>
  <g fill="#ffffff" opacity="0.75">
    <rect x="17.5" y="53.5" width="7" height="4.5" rx="1.6"/>
    <rect x="39.5" y="53.5" width="7" height="4.5" rx="1.6"/>
  </g>
</svg>
